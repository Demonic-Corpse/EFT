name: Elite Football CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Validate (Type Check & Production Build)
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Production Client Bundle
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Deploy to Production VPS (87.232.72.134)
  # -------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '87.232.72.134' }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP_DIR="${{ secrets.TARGET_DIR || '/var/www/football' }}"
            BRANCH="${{ github.ref_name }}"

            echo "🚀 Deploying Elite Football Training to $APP_DIR (branch: $BRANCH)..."

            # 1. Create target directory if it does not exist
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # 2. Check if git repo exists, otherwise clone
            if [ ! -d ".git" ]; then
              echo "📦 Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git .
            fi

            # 3. Pull latest code cleanly
            echo "📥 Fetching latest code..."
            git fetch --all
            git reset --hard "origin/$BRANCH"

            # 4. Inject production .env if secret is configured
            if [ -n '${{ secrets.ENV_FILE }}' ]; then
              echo "🔐 Writing production .env from GitHub Secrets..."
              cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF
              chmod 600 .env
            elif [ ! -f .env ]; then
              echo "⚠️ No .env found. Copying from .env.example..."
              cp .env.example .env
              chmod 600 .env
            fi

            # 5. Ensure required data & upload directories exist
            mkdir -p server/data public/uploads
            chmod 755 public/uploads server/data

            # 6. Install dependencies
            echo "📦 Installing npm dependencies..."
            npm ci --prefer-offline || npm install

            # 7. Build production frontend assets
            echo "⚡ Compiling production build..."
            npm run build

            # 8. Ensure PM2 process manager is available
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "⚙️ Installing PM2 globally..."
              npm install -g pm2
            fi

            # 9. Start or restart with PM2
            echo "🔄 Restarting application with PM2..."
            if [ -f "ecosystem.config.cjs" ]; then
              pm2 startOrRestart ecosystem.config.cjs --update-env
            else
              pm2 restart elite-football || pm2 start npm --name "elite-football" -- run server
            fi

            pm2 save
            echo "✅ Deployment completed successfully!"

